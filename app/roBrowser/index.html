<!DOCTYPE html>
<html>

<head>
	<title>SakExe : FullClient</title>
	<meta name="viewport" content="initial-scale=1.0, user-scalable=no" />
	<script type="text/javascript" src="./env.php"></script>
	<script type="text/javascript" src="./env.js"></script>
	<script type="text/javascript" src="./api.js"></script>
	<script type="text/javascript">
		function initialize() {
			var env = window.RO_ENV || {};
			var host = (env.RATHENA_HOST && env.RATHENA_HOST !== "0.0.0.0" && env.RATHENA_HOST !== "serve")
				? env.RATHENA_HOST
				: (window.location.hostname || "192.168.179.5");
			var webPort = env.WEB_PORT || window.location.port || "8080";
			var wsproxyPort = env.WSPROXY_PORT || "5999";
			var loginPort = env.LOGIN_PORT ? parseInt(env.LOGIN_PORT, 10) : 6900;
			var packetver = env.PACKETVER ? parseInt(env.PACKETVER, 10) : 20141022;

			var remoteClientUrl = window.location.protocol + "//" + host + (webPort ? (":" + webPort) : "") + "/client/";
			var socketProxyUrl = "ws://" + host + ":" + wsproxyPort + "/";

			var ROConfig = {
				target: document.getElementById("robrowser"),
				remoteClient: remoteClientUrl,
				type: ROBrowser.TYPE.FRAME,
				development: true,
				servers: [{
					display: "Local",
					desc: "roBrowser's demo server",
					address: host,
					port: loginPort,
					version: 55,
					langtype: 1,
					packetver: packetver,
					packetKeys: true,
					socketProxy: socketProxyUrl,
					adminList: [2000000]
				}],
				skipServerList: false,
				skipIntro: true,
			};
			var RO = new ROBrowser(ROConfig);
			RO.start();
		}
		window.addEventListener("load", initialize, false);
	</script>
	<style>
		#mode-switch {
			position: fixed;
			right: 8px;
			top: 8px;
			z-index: 100000;
			padding: 5px 8px;
			background: rgba(0, 0, 0, .7);
			color: #fff;
			font: 12px Arial, sans-serif;
			text-decoration: none;
		}

		html,
		body,
		iframe,
		#robrowser {
			height: 100%;
			width: 100%;
			margin: 0;
			padding: 0;
			overflow: hidden;
			min-width: 800px;
			min-height: 600px;
		}
	</style>
</head>

<body>
	<a id="mode-switch" href="/renewal/" target="_self">Apri Renewal</a>
	<div id="robrowser">Initializing roBrowser...</div>
</body>

</html>
