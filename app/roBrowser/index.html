<!DOCTYPE html>
<html>
	<head>
		<title>SakExe : FullClient</title>
		<meta name="viewport" content="initial-scale=1.0, user-scalable=no" />
		<script type="text/javascript" src="./api.js"></script>
		<script type="text/javascript">
			function initialize() {
				var ROConfig = {
					target:        document.getElementById("robrowser"),
					remoteClient:  "http://localhost:8080/client/",
					type:          ROBrowser.TYPE.FRAME,
					development: true,
					servers: [{
						display:     "Local",
						desc:        "roBrowser's demo server",
						address:     "serve",
						port:        6900,
						version:     55,
						langtype:    1,
						packetver:   20141022,
						packetKeys:  true,
						socketProxy: "ws://127.0.0.1:5999/",
						adminList:   [2000000]
					}],
					skipServerList:  false,
					skipIntro:       true,
				};
				var RO = new ROBrowser(ROConfig);
				RO.start();
			}
			window.addEventListener("load", initialize, false);
		</script>
		<style>
			#mode-switch {
				position: fixed;
				right: 8px;
				top: 8px;
				z-index: 100000;
				padding: 5px 8px;
				background: rgba(0, 0, 0, .7);
				color: #fff;
				font: 12px Arial, sans-serif;
				text-decoration: none;
			}

			html, body, iframe, #robrowser {
				height:100%;
				width:100%;
				margin:0;
				padding:0;
				overflow: hidden;
				min-width: 800px;
				min-height: 600px;
			}
		</style>
	</head>
	<body>
		<a id="mode-switch" href="/renewal/" target="_self">Apri Renewal</a>
		<div id="robrowser">Initializing roBrowser...</div>
	</body>
</html>
