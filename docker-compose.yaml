version: '3' # vs mais atual

services: 

  # Emulador
  serve: 
    build: serve
    container_name: ro-ragnarok-serve
    restart: always
    tty: true
    working_dir: /rathena
    # SEMPRE QUE REINICIAR O CONTAINER IRAR BUIDAR O EMULADOR  
    volumes:
      # LEMBRAR SUBISTITUIR O NOME <EMULADOR> PARA A PASTE DO SEU SERVER
      - ./serve/rathena:/rathena
      - ./serve/pre-import.sh:/pre-import.sh:ro
    # entrypoint: ./entrypoint.sh 20141022
    # TESTAR UM HEXED
    # versione client/server: 20141022
    # non funziona 20250604
    command: >
      bash -c "./configure --enable-packetver=20141022 &&
      make clean &&
      make server &&
      MYSQL_HOST=db MYSQL_DATABASE=ragnarok MYSQL_USER=ragnarok MYSQL_PASSWORD=ragnarok
      /bin/bash /pre-import.sh &&
      ./athena-start start &&
      tail -f /dev/null"
    ports:
      - "5121:5121"
      - "6121:6121"
      - "6900:6900"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - REDIRECT_STATUS=true
    networks:
      - ragnarok-app-network
    depends_on:
      db:
        condition: service_started
      
  db:
    build: db
    container_name: ro-ragnarok-db
    restart: always
    tty: true
    ports:
      - "3306:3306"
    volumes:
      - ./db/dbdata:/var/lib/mysql
      - ./db/sql-files:/docker-entrypoint-initdb.d
      - ./FluxCP/data/schemas:/fluxcp-schemas:ro
      # - ./db/log:/var/log/mysql
    environment:
      - MYSQL_DATABASE=ragnarok
      - MYSQL_ROOT_PASSWORD=R00t+
      - MYSQL_USER=ragnarok
      - MYSQL_PASSWORD=ragnarok
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uragnarok", "-pragnarok"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ragnarok-app-network

  # RoBrawser
  app:
    build: app
    container_name: ro-browser-Brawser
    volumes:
      - ./app:/var/www
    networks:
      - ragnarok-app-network

  nginx:
    build: nginx
    container_name: ro-browser-nginx
    restart: always
    tty: true
    ports:
      - "8080:80"
    volumes:
      - ./app/roBrowser:/var/www/roBrowser
    networks:
      - ragnarok-app-network
    depends_on:
      - app

  fluxcp:
    build: FluxCP
    container_name: ro-fluxcp
    restart: always
    ports:
      - "8081:80"
    environment:
      - FLUX_DB_HOST=db
      - FLUX_DB_PORT=3306
      - FLUX_DB_NAME=ragnarok
      - FLUX_DB_USER=ragnarok
      - FLUX_DB_PASSWORD=ragnarok
      - FLUX_INSTALLER_PASSWORD=ragnarok
      - FLUX_LOGIN_ADDRESS=serve
      - FLUX_CHAR_ADDRESS=serve
      - FLUX_MAP_ADDRESS=serve
      - FLUX_SERVER_ADDRESS=localhost:8081
      - FLUX_BASE_URI=
      - FLUX_FORCE_HTTPS=0
      - FLUX_REQUIRE_OWNERSHIP=0
    volumes:
      - ./FluxCP:/var/www/html
    networks:
      - ragnarok-app-network
    depends_on:
      db:
        condition: service_started

  wsproxy:
    # image: node:18
    build: wsproxy
    container_name: ro-browser-wsproxy
    restart: always
    tty: true
    # command: >
    #   bash -c wsproxy -a 127.0.0.1:6900,127.0.0.1:6121,127.0.0.1:5121
    command: >
      bash -c "wsproxy -a serve:6900,serve:6121,serve:5121"
    ports:
      - "5999:5999"
    networks:
      - ragnarok-app-network
    depends_on:
      serve:
        condition: service_started
      app:
        condition: service_started

  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      # 8080 is the host port and 80 is the docker port
      - 9000:80
    environment:
      - PMA_ARBITRARY:1
      - PMA_HOST:db
      - MYSQL_USERNAME:ragnarok
      - MYSQL_ROOT_PASSWORD:ragnarok
    depends_on: 
      - db
    networks:
      - ragnarok-app-network
                        
networks:
  ragnarok-app-network:
    driver: bridge
