map $http_referer $renewal_request {
    default 0;
    "~*/renewal/" 1;
}

server {
    listen 80;
    index index.php index.html;
    root /var/www/roBrowser;
    
    location ~ \.php$ {
        try_files $uri = 404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass app:9000;
    }

    location /client/ {
        try_files $uri $uri/ @client_file;
    }

    location ^~ /renewal/client/ {
        rewrite ^/renewal/client/(.*)$ /client/$1 last;
    }

    location @client_file {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/roBrowser/client/index.php;
        fastcgi_param SCRIPT_NAME /client/index.php;
        fastcgi_param QUERY_STRING request=$uri&$query_string;
        fastcgi_pass app:9000;
    }

    location /renewal/ {
        proxy_pass http://renewal:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ^~ /wsproxy/ {
        proxy_pass http://wsproxy:5999/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /renewal/wsproxy/ {
        proxy_pass http://wsproxy:5999/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }



    location /@vite/ {
        proxy_pass http://renewal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /src/ {
        if ($renewal_request) {
            return 418;
        }
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /node_modules/ {
        proxy_pass http://renewal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    error_page 418 = @renewal_src;

    location @renewal_src {
        proxy_pass http://renewal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }


    location / {
        return 302 /renewal/;
    }
}
